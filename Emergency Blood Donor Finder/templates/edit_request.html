{% extends 'base.html' %}{% block title %}Edit request | Emergency Blood Finder{% endblock %}{% block content %}<section class="page-wrap narrow"><p class="eyebrow">Update your request</p><h1>Edit request #{{ blood_request['id'] }}</h1><form class="panel form-grid" method="post"><label>Blood group<select name="blood_group">{% for group in blood_groups %}<option value="{{ group }}" {% if form_data.blood_group == group %}selected{% endif %}>{{ group }}</option>{% endfor %}</select></label><label>City<input name="city" maxlength="100" value="{{ form_data.city }}" required></label><label>Units required<input type="number" min="1" max="100" name="units" value="{{ form_data.units }}" required></label><label>Priority level<select name="emergency">{% for level in emergency_levels %}<option value="{{ level }}" {% if form_data.emergency == level %}selected{% endif %}>{{ level }}</option>{% endfor %}</select></label><label>Required date/time<input type="datetime-local" name="required_at" value="{{ form_data.required_at }}" required></label><label>Expiry date/time<input type="datetime-local" name="expiry_at" value="{{ form_data.expiry_at }}" required></label><button class="button" type="submit">Save request</button></form></section>{% endblock %}
