{% extends 'base.html' %}{% block title %}My profile | Emergency Blood Finder{% endblock %}{% block content %}<section class="page-wrap narrow"><p class="eyebrow">Private profile</p><h1>My donor profile</h1><form id="update" class="panel form-grid" method="post"><label>Full name<input name="name" value="{{ user['name'] }}" maxlength="100" required></label><label>Email<input value="{{ user['email'] }}" disabled></label><label>Blood group<select name="blood_group" required>{% for group in blood_groups %}<option value="{{ group }}" {% if user['blood_group']==group %}selected{% endif %}>{{ group }}</option>{% endfor %}</select></label><label>City<input name="city" value="{{ user['city'] }}" maxlength="100" required></label><label>Phone<input name="phone" value="{{ user['phone'] }}" required></label><label>Availability<select name="available"><option value="1" {% if user['available'] %}selected{% endif %}>Available</option><option value="0" {% if not user['available'] %}selected{% endif %}>Not Available</option></select></label><p class="muted">Donor map locations are shown at city level.</p><button class="button" type="submit">Update profile</button></form></section>{% endblock %}
