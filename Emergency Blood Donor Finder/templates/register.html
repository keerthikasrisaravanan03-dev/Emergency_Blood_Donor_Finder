{% extends 'base.html' %}{% block title %}Register | Emergency Blood Finder{% endblock %}{% block content %}<section class="page-wrap narrow"><p class="eyebrow">Join the network</p><h1>Register as a donor</h1><p class="muted">Share only the details needed for this college-project prototype.</p><form class="panel form-grid" method="post"><label>Full name<input name="name" value="{{ form_data.name }}" required></label><label>Email<input type="email" name="email" value="{{ form_data.email }}" required></label><label>Password<input type="password" name="password" minlength="6" required></label><label>Blood group<select name="blood_group" required><option value="">Select group</option>{% for group in blood_groups %}<option {% if form_data.blood_group==group %}selected{% endif %}>{{ group }}</option>{% endfor %}</select></label><label>City<input name="city" value="{{ form_data.city }}" required></label><label>Phone number<input name="phone" value="{{ form_data.phone }}" required></label><label>Availability<select name="available"><option value="1" selected>Available</option><option value="0">Not available</option></select></label><button class="button" type="submit">Create donor account</button></form></section>{% endblock %}
